[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "okn-guard"
version = "0.1.0"
description = "Provenance-aware biomedical KG and literature claim-auditing system"
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    "mcp",
    "httpx",
    "pydantic>=2",
    "pydantic-settings",
    "python-dotenv",
    "tenacity",
    "orjson",
    "PyYAML",
    "pandas",
    "numpy",
    "scikit-learn",
    "rapidfuzz",
    "sqlalchemy",
    "aiosqlite",
    "structlog",
    "typer",
    "rich"
]

[project.optional-dependencies]
agents = [
    "langgraph",
    "langchain-core",
    "langchain-ollama"
]

api = [
    "fastapi",
    "uvicorn[standard]"
]

ui = [
    "streamlit"
]

dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "respx",
    "hypothesis",
    "ruff",
    "mypy",
    "pre-commit"
]

[project.scripts]
okn-guard = "okn_guard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/okn_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["okn_guard"]